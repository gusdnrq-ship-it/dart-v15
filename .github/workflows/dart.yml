name: DART v15 - 매일 불장 TOP3

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

jobs:
  fetch-and-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run v15
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          pip install requests beautifulsoup4
          python main_v15.py
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    needs: fetch-and-score
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
