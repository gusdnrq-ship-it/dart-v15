name: DART v16 MAX - 불장 알람 FIXED

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'  # 19:00 KST
    - cron: '0 23 * * *'  # 08:00 KST

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Run scorer - auto detect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          ls -la
          if [ -f main.py ]; then
            echo "Found main.py - running"
            python main.py
          elif [ -f main_v16_max.py ]; then
            echo "Found main_v16_max.py - running"
            python main_v16_max.py
          elif [ -f main_v15.py ]; then
            echo "Found main_v15.py - running"
            python main_v15.py
          else
            echo "No main file found! Listing all py:"
            find . -name "*.py" | head -20
            exit 1
          fi
          ls -lh dist/
          cat dist/news_sns_v15_min.json | head -200
      - name: Deploy to gh-pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          mkdir -p /tmp/deploy
          cp -r dist/* /tmp/deploy/
          git fetch origin gh-pages || echo "no gh-pages branch yet"
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi
          # clean
          rm -rf *.py *.json .github dart.yml 2>/dev/null || true
          rm -rf dist 2>/dev/null || true
          cp -r /tmp/deploy/* .
          touch .nojekyll
          git add .
          git commit -m "deploy v16 MAX $(date +'%Y-%m-%d %H:%M:%S KST') - 불장알람" || echo "no changes"
          git push -f origin gh-pages
